<style>
:root{--bg:#080f20;--card:#111c38;--bd:#243457;--tx:#eef1f8;--mut:#9aa6c4;--ac:#d6b05c;--ink:#1a1405;--err:#ff8a7a;--ok:#5fd38d;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 480px at 50% -140px,#18294f 0,transparent 70%),var(--bg);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
h1,h2{font-family:Oswald,"Arial Narrow",Impact,sans-serif;font-weight:700;letter-spacing:.4px;line-height:1.15}
h2{margin:0 0 10px;font-size:22px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:rgba(8,15,32,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.topbar img{width:34px;height:34px;border-radius:50%;border:2px solid var(--ac);background:#fff}
.clock{margin-left:auto;text-align:right;line-height:1.1;white-space:nowrap}.clock time{display:block;font:700 20px/1.1 Oswald,"Arial Narrow",Impact,sans-serif;color:var(--ac);letter-spacing:.5px;font-variant-numeric:tabular-nums}.clock small{font-size:11px;color:var(--mut)}
@media (max-width:360px){.topbar b{font-size:18px}.clock time{font-size:17px}}
.topbar b{font:700 22px/1 Oswald,"Arial Narrow",Impact,sans-serif;letter-spacing:1.5px}.topbar b span{color:var(--ac)}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:rgba(10,18,40,.95);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px 9px;background:none;border:0;color:var(--mut);font:600 11px/1 system-ui,sans-serif;cursor:pointer}
#tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--ac);box-shadow:inset 0 2px 0 var(--ac)}
main{max-width:720px;margin:0 auto;padding:14px 14px 24px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,textarea,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--bd);background:#0b1430;color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
textarea{min-height:110px;font:14px/1.4 ui-monospace,monospace}
.pr{margin-top:12px;background:var(--ac);color:var(--ink);border:0;padding:12px 22px;border-radius:12px;font:700 16px/1.2 Oswald,"Arial Narrow",system-ui,sans-serif;letter-spacing:.6px;cursor:pointer}
.pr:active{transform:scale(.98)}.pr:disabled{opacity:.6}
.pr.big{padding:15px 26px;font-size:18px}
.pr.ghost{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
.sm{border:1px solid var(--bd);background:transparent;color:var(--tx);padding:6px 12px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer;margin-left:4px}
.mut{color:var(--mut);font-size:14px}.err{color:var(--err)}.ok{color:var(--ok)}
.tw{overflow-x:auto}.kt{width:100%;border-collapse:collapse;font-size:14px;min-width:440px}.kt th,.kt td{padding:8px 5px;text-align:center;border-top:1px solid var(--bd)}.kt .l{text-align:left}.kt th{font-size:12px;color:var(--mut)}.kt tr.top td:first-child{box-shadow:inset 3px 0 var(--ac)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:-2px}
.cb{margin:-16px -16px 10px;padding:12px 16px}
input[type=color]{width:56px;height:38px;padding:2px;cursor:pointer}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.no{display:inline-block;min-width:32px;text-align:center;background:var(--ac);color:var(--ink);border-radius:8px;font-weight:700;padding:1px 6px;margin-right:8px}
.step{display:flex;gap:12px;margin:14px 0}.step i{flex:none;width:32px;height:32px;border-radius:50%;background:var(--ac);color:var(--ink);display:grid;place-items:center;font:700 16px Oswald,sans-serif;font-style:normal}
code{background:#0b1430;padding:2px 6px;border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 5px;border-top:1px solid var(--bd);text-align:left}
.hero2{text-align:center;padding:6px 0 2px}
.cardimg{display:block;width:min(62vw,250px);height:auto;margin:0 auto 6px;filter:drop-shadow(0 18px 26px rgba(0,0,0,.6));animation:flt 5s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-8px) rotate(1.2deg)}}
@media (prefers-reduced-motion:reduce){.cardimg{animation:none}}
.hero2 h1{margin:10px 0 8px;font-size:36px}.hero2 h1 span{color:var(--ac)}
.hero2 p{margin:0 auto;max-width:440px;color:var(--mut)}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 4px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 6px;text-align:center}
.stat b{display:block;font:700 30px/1.1 Oswald,sans-serif;color:var(--ac)}.stat span{font-size:12px;color:var(--mut)}
.bar{height:10px;border-radius:99px;background:#0b1430;border:1px solid var(--bd);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ac),#f2dda0)}
details{border-top:1px solid var(--bd);padding:11px 0}details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}summary::after{content:"+";color:var(--ac);font-size:20px;line-height:1}
details[open] summary::after{content:"–"}
details p{margin:8px 0 0;color:var(--mut);font-size:14px}
.foot{text-align:center;color:var(--mut);font-size:12px;padding:6px 14px 10px}
</style>

function vKartu(){

    if(!u)return;
    if(!p){o.innerHTML=`<p class="err">Kartu @${esc(u)} belum ada. Daftar dulu di tab “Daftar”.</p>`;return;}

    o.innerHTML=`<div style="text-align:center"><img id="ci" alt="Kartu pemain @${esc(p.u)}" style="width:100%;max-width:340px;height:auto;min-height:200px"><br><button class="pr" id="dl" disabled>Menyiapkan kartu…</button> <button class="pr ghost" id="bg" disabled>Bagikan</button>

      let url="";try{url=cv.toDataURL("image/png");}catch(e){}

      const bt=$("#dl");if(!bt)return;bt.disabled=false;bt.textContent="Simpan gambar kartu";

}
async function shareCard(cv,p){
  const link=location.origin+location.pathname+"#kartu="+p.u,txt="Aku resmi jadi pemain "+p.club+" di Liga Netizen! No. "+p.n+" ("+p.pos+"). Ayo ikut daftar: "+link;
  const blob=await new Promise(r=>{try{cv.toBlob(r,"image/png");}catch(e){r(null);}});
  try{
    if(blob&&navigator.canShare){const f=new File([blob],"kartu-"+p.u+".png",{type:"image/png"});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],text:txt});return;}}
    if(navigator.share){await navigator.share({text:txt,url:link});return;}
  }catch(e){if(e&&e.name==="AbortError")return;}
  window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank","noopener");
}
async function saveCard(cv,p){
  const blob=await new Promise(r=>{try{cv.toBlob(r,"image/png");}catch(e){r(null);}});
  if(!blob){alert("Gambar belum bisa disimpan otomatis. Tekan lama gambar kartu lalu pilih Simpan gambar.");return;}
  const name="kartu-"+p.u+".png",file=new File([blob],name,{type:"image/png"});
  const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  try{if(mobile&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Kartu pemain Liga Netizen"});return;}}
  catch(e){if(e&&e.name==="AbortError")return;}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
  catch(e){alert("Unduhan gagal. Tekan lama gambar kartu lalu pilih Simpan gambar.");}
}

async function drawCard(cv,p){
  try{await document.fonts.load("700 60px Oswald");}catch(e){}
  await cardReady;
  const x=cv.getContext("2d");if(!x)return;const FF='Oswald,"Arial Narrow",Impact,sans-serif';
  x.clearRect(0,0,cv.width,cv.height);x.drawImage(CARD,0,0,928,1152);
  const put=(t,cx,cy,w,s,col)=>{while(s>20){x.font="700 "+s+"px "+FF;if(x.measureText(t).width<=w)break;s-=2;}x.fillStyle=col;x.fillText(t,cx,cy);};
  x.textAlign="center";x.textBaseline="middle";
  put(String(p.n),262,350,110,66,"#d6b05c");
  put(p.pos,262,487,90,30,"#d6b05c");
  put(p.u.toUpperCase(),475,910,520,92,"#d6b05c");
  put(p.club.toUpperCase(),475,990,440,44,"#e8d29a");
}

function tabel(){
  const T={};DATA.clubs.forEach(c=>T[c.name]={k:c.name,m:0,w:0,d:0,l:0,gf:0,ga:0});
  (DATA.matches||[]).forEach(x=>{const h=T[x.home],a=T[x.away];if(!h||!a)return;
    h.m++;a.m++;h.gf+=x.hg;h.ga+=x.ag;a.gf+=x.ag;a.ga+=x.hg;
    if(x.hg>x.ag){h.w++;a.l++;}else if(x.hg<x.ag){a.w++;h.l++;}else{h.d++;a.d++;}});
  return Object.values(T).map(t=>({...t,gd:t.gf-t.ga,pts:t.w*3+t.d})).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||a.k.localeCompare(b.k));
}
function vKlasemen(){
  if(!DATA.clubs.length){$("#app").innerHTML='<div class="card mut">Belum ada klub.</div>';return;}
  const T=tabel(),ms=(DATA.matches||[]).slice().reverse();
  $("#app").innerHTML=`<div class="card"><h2>Klasemen Liga Netizen</h2><div class="tw"><table class="kt"><tr><th>#</th><th class="l">Klub</th><th>Main</th><th>M</th><th>S</th><th>K</th><th>GM</th><th>GK</th><th>SG</th><th>Poin</th></tr>${T.map((t,i)=>`<tr class="${i<3&&t.m?"top":""}"><td>${i+1}</td><td class="l">${dot(t.k)}<b>${esc(t.k)}</b></td><td>${t.m}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf}</td><td>${t.ga}</td><td>${t.gd>0?"+":""}${t.gd}</td><td><b>${t.pts}</b></td></tr>`).join("")}</table></div>
  <p class="mut">Menang 3 poin, seri 1, kalah 0. Urutan: poin, selisih gol, gol, nama klub. M = menang, S = seri, K = kalah, GM = gol memasukkan, GK = gol kemasukan, SG = selisih gol.${(DATA.matches||[]).length?"":" Belum ada pertandingan."}</p></div>
  ${ms.length?`<div class="card"><h2>Hasil pertandingan <span class="mut">(${ms.length})</span></h2>${ms.slice(0,20).map(x=>`<div class="row"><span>${esc(x.home)}</span><b>${x.hg} – ${x.ag}</b><span style="text-align:right">${esc(x.away)}</span></div>`).join("")}${ms.length>20?`<button class="sm" id="allms" style="margin:10px 0 0">Tampilkan semua ${ms.length} hasil</button>`:""}</div>`:""}`;
  const bm=$("#allms");if(bm)bm.onclick=()=>{bm.parentElement.innerHTML=`<h2>Hasil pertandingan <span class="mut">(${ms.length})</span></h2>`+ms.map(x=>`<div class="row"><span>${esc(x.home)}</span><b>${x.hg} – ${x.ag}</b><span style="text-align:right">${esc(x.away)}</span></div>`).join("");};
}

let KQ="";
function vKlub(){
  if(!DATA.clubs.length){$("#app").innerHTML='<div class="card mut">Belum ada klub.</div>';return;}
  $("#app").innerHTML=`<div class="card" style="padding:12px 14px"><label for="kq" style="margin-top:0">Cari pemain</label><input id="kq" value="${esc(KQ)}" placeholder="@username" autocapitalize="off" autocomplete="off"></div><div id="kl"></div>`;
  const draw=()=>{KQ=$("#kq").value;const q=user(KQ);
    if(q){const ls=DATA.players.filter(p=>p.u.includes(q)).sort((a,b)=>a.u.localeCompare(b.u));
      $("#kl").innerHTML=`<div class="card"><h2>Hasil pencarian <span class="mut">(${ls.length})</span></h2>${ls.slice(0,60).map(p=>`<div class="row"><span><span class="no">${p.n}</span>@${esc(p.u)}</span><span class="mut">${esc(p.pos)} · ${dot(p.club)}${esc(p.club)}</span></div>`).join("")||'<p class="mut">Tidak ada pemain dengan username itu.</p>'}${ls.length>60?`<p class="mut">Menampilkan 60 dari ${ls.length}. Persempit pencarian.</p>`:""}</div>`;return;}
    const cs=DATA.clubs.map(c=>({...c,ps:DATA.players.filter(p=>p.club===c.name).sort((a,b)=>a.n-b.n)})).sort((a,b)=>b.ps.length-a.ps.length||a.name.localeCompare(b.name));
    $("#kl").innerHTML=cs.map(c=>{const k1=hex(c.c1),k2=hex(c.c2),tx=ink(k1);
      const rows=c.ps.length?c.ps.map(p=>`<div class="row"><span><span class="no" style="background:${k1};color:${tx};box-shadow:0 0 0 2px ${k2}">${p.n}</span>@${esc(p.u)}</span><span class="mut">${esc(p.pos)}</span></div>`).join(""):'<p class="mut">Belum ada pemain.</p>';
      return `<div class="card" style="border-color:${k2};overflow:hidden"><div class="cb" style="background:${STR},linear-gradient(135deg,${k1},${dark(k1)});color:${tx};border-bottom:4px solid ${k2}"><b style="font-size:19px">${esc(c.name)}</b><span style="opacity:.85;font-size:14px"> · ${c.ps.length}/${c.max} pemain</span></div>${rows}</div>`;}).join("");};
  $("#kq").oninput=draw;draw();
}

const MIN_KLUB=8;
function vBeranda(){
  const nP=DATA.players.length,nC=DATA.clubs.length,ms=DATA.matches||[],L=LOADED,MIN=MIN_KLUB;
  let status="";
  if(L&&ms.length){const T=tabel().slice(0,3),rs=ms.slice(-3).reverse();
    status=`<div class="card"><h2>Klasemen sementara</h2>${T.map((t,i)=>`<div class="row"><span><b>${i+1}</b> &nbsp;${dot(t.k)}${esc(t.k)}</span><span class="mut">${t.m} main · <b style="color:var(--ac)">${t.pts} poin</b></span></div>`).join("")}<h2 style="margin-top:16px;font-size:18px">Hasil terbaru</h2>${rs.map(x=>`<div class="row"><span>${esc(x.home)}</span><b>${x.hg} – ${x.ag}</b><span style="text-align:right">${esc(x.away)}</span></div>`).join("")}<button class="sm" data-go="klasemen" style="margin:12px 0 0">Lihat klasemen lengkap</button></div>`;
  }else if(L){const pct=Math.min(100,Math.round(nC/MIN*100)),top=DATA.clubs.map(c=>({c,n:DATA.players.filter(p=>p.club===c.name).length})).sort((a,b)=>b.n-a.n).slice(0,3);
    status=`<div class="card"><h2>Liga belum dimulai</h2><p class="mut" style="margin:0 0 10px">${nC>=MIN?"Syarat jumlah klub sudah terpenuhi.":"Liga dimulai kalau sudah ada minimal "+MIN+" klub."}</p><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${MIN}" aria-valuenow="${Math.min(nC,MIN)}"><i style="width:${pct}%"></i></div><p class="mut" style="margin:8px 0 0"><b style="color:var(--tx)">${nC}</b> dari ${MIN} klub</p>${top.length?`<div style="margin-top:10px">${top.map(x=>`<div class="row"><span>${dot(x.c.name)}${esc(x.c.name)}</span><span class="mut">${x.n}/${x.c.max} pemain</span></div>`).join("")}</div>`:""}</div>`;
  }
  $("#app").innerHTML=`<section class="hero2"><img id="hc" class="cardimg" alt="Contoh kartu pemain Liga Netizen" width="250" height="310" src="${CARD.src}">
  <h1>Liga sepak bola yang <span>dibangun follower</span></h1>
  <p>Follow, daftar, lalu pilih nomor punggung, posisi, dan klubmu. Kartu pemainmu langsung jadi.</p>
  <div class="cta"><button class="pr big" data-go="daftar">Daftar jadi pemain</button><button class="pr big ghost" data-go="klub">Lihat klub</button></div></section>
  <div class="stats"><div class="stat"><b>${L?nP:"–"}</b><span>pemain</span></div><div class="stat"><b>${L?nC:"–"}</b><span>klub</span></div><div class="stat"><b>${L&&DATA.episode?DATA.episode:"–"}</b><span>episode</span></div></div>
  ${status}
  <div class="card"><h2>Tiga langkah jadi pemain</h2>
  <div class="step"><i>1</i><div><b>Follow akun liga</b><br><span class="mut">Satu follower, satu pemain.</span></div></div>
  <div class="step"><i>2</i><div><b>Daftar dan pilih identitasmu</b><br><span class="mut">Isi username, lalu pilih klub, nomor punggung (1–99), dan posisi.</span></div></div>
  <div class="step"><i>3</i><div><b>Ambil kartu pemainmu</b><br><span class="mut">Kartu langsung muncul setelah daftar, dan bisa dicari lagi kapan saja di menu Kartu.</span></div></div></div>
  <div class="card"><h2>Pertanyaan umum</h2>
  <details><summary>Apa itu Liga Netizen?</summary><p>Liga sepak bola di media sosial. Setiap follower akun liga bisa jadi pemain, dan klub dibentuk dari komentar teratas.</p></details>
  <details><summary>Username saya tidak ditemukan, kenapa?</summary><p>Username harus ada di daftar follower, dan daftar itu diperbarui berkala. Pastikan kamu sudah follow akun liga, lalu coba lagi nanti.</p></details>
  <details><summary>Posisi dan kuota per klub</summary><div class="tw" style="margin-top:8px"><table>${POSQ.map(q=>`<tr><td><b>${q[0]}</b></td><td>${q[1]}</td><td>${q[2]} orang</td></tr>`).join("")}</table></div><p>Satu klub maksimal 25 pemain. Posisi yang kuotanya penuh dan nomor yang sudah dipakai di klub itu tidak bisa dipilih. Yang mendaftar lebih dulu mendapat nomornya.</p></details>
  <details><summary>Salah memilih nomor atau posisi?</summary><p>Hubungi admin lewat akun liga. Admin bisa menghapus pendaftaranmu supaya kamu bisa mendaftar ulang.</p></details>
  <details><summary>Apakah username saya tampil di publik?</summary><p>Ya. Username, nomor, posisi, dan klub tampil di halaman Klub. Liga tidak pernah meminta password, nomor HP, atau alamat.</p></details></div>
  <p class="foot">Liga Netizen · Gratis · Tanpa password</p>`;
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  const cv=document.createElement("canvas");cv.width=928;cv.height=1152;
  drawCard(cv,{u:"namamu",n:10,pos:"ST",club:"klubmu"}).then(()=>{try{const el=$("#hc");if(el&&tab==="beranda")el.src=cv.toDataURL("image/png");}catch(e){}});
}

/* ---------- ADMIN ---------- */
let ADM=false;
async function chkAdmin(){try{const {data:{session}}=await sb.auth.getSession();if(session){const a=await sb.rpc("is_admin");ADM=a.data===true;}}catch(e){}}
const act=async p=>{const r=await p;if(r&&r.error)alert("Gagal: "+r.error.message);await loadAll();render();};
function vAdmin(){
  const A=$("#app");
  if(!ADM){
    A.innerHTML=`<div class="card"><h2>Masuk admin</h2><label for="em">Email</label><input id="em" type="email"><label for="pw">Password</label><input id="pw" type="password"><button class="pr" id="li">Masuk</button><p class="err" id="m"></p></div>`;
    $("#li").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$("#em").value,password:$("#pw").value});if(error){$("#m").textContent="Login gagal.";return;}await chkAdmin();if(!ADM){$("#m").textContent="Akun ini bukan admin.";return;}render();};return;
  }
  A.innerHTML=`<div class="card"><h2>Episode</h2><input id="ep" type="number" value="${DATA.episode||0}"><button class="pr" id="se">Simpan</button></div>
  <div class="card"><h2>Import daftar follower</h2><p class="mut">Pilih followers_1.json dari “Download your information” Instagram, atau file teks (dari platform mana pun) berisi satu username per baris. Hanya username di daftar ini yang bisa mendaftar.</p><input type="file" id="f" accept=".json,.txt,.csv"><p class="mut" id="im"></p></div>
  <div class="card"><h2>Tambah follower manual</h2><p class="mut">Ketik satu username, atau beberapa sekaligus (pisahkan dengan baris baru, spasi, atau koma). Mereka langsung boleh mendaftar.</p><label for="mu">Username</label><input id="mu" placeholder="@username" autocapitalize="off" autocomplete="off"><button class="pr" id="mb">Tambah</button><p class="mut" id="mr"></p>
  <details style="margin-top:6px"><summary>Tambah banyak sekaligus</summary><textarea id="mx" placeholder="satu username per baris"></textarea><button class="pr ghost" id="mxb">Tambah semua</button></details></div>
  <div class="card"><h2>Klub</h2>${DATA.clubs.map(c=>`<div class="row" style="flex-wrap:wrap;gap:8px"><span>${dot(c.name)}${esc(c.name)} <span class="mut">maks ${c.max}</span></span><span><input type="color" data-k1="${c.id}" value="${hex(c.c1)}"><input type="color" data-k2="${c.id}" value="${hex(c.c2)}"><button class="sm" data-cs="${c.id}">Simpan warna</button><button class="sm" data-c="${c.id}">Hapus</button></span></div>`).join("")}
  <div class="g2"><div><label for="cn">Nama klub</label><input id="cn"></div><div><label for="cm">Maks pemain (1–25)</label><input id="cm" type="number" value="25" min="1" max="25"></div></div>
  <div class="g2"><div><label for="k1">Warna utama</label><input id="k1" type="color" value="#1f9d55"></div><div><label for="k2">Warna kedua</label><input id="k2" type="color" value="#f5c518"></div></div><button class="pr" id="ac">Tambah klub</button></div>
  <div class="card"><h2>Hasil pertandingan</h2><p class="mut">Satu per baris: Klub A 3-1 Klub B. Daftar ini menggantikan seluruh hasil sebelumnya.</p><textarea id="mt">${(DATA.matches||[]).map(x=>x.home+" "+x.hg+"-"+x.ag+" "+x.away).join("\n")}</textarea><button class="pr" id="sm2">Simpan hasil</button><p class="err" id="mm"></p></div>
  <div class="card"><h2>Pemain (${DATA.players.length})</h2><input id="ps" placeholder="Cari username untuk menghapus"><div id="pl"></div></div>
  <button class="sm" id="lo">Keluar admin</button>`;
  $("#se").onclick=()=>act(sb.from("config").update({episode:parseInt($("#ep").value,10)||0}).eq("id",1));
  $("#ac").onclick=()=>{const n=$("#cn").value.trim();if(n)act(sb.from("clubs").insert({name:n,max_players:Math.min(25,Math.max(1,parseInt($("#cm").value,10)||25)),color1:$("#k1").value,color2:$("#k2").value}));};
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{if(confirm("Hapus klub ini beserta semua pemain dan hasil pertandingannya?"))act(sb.from("clubs").delete().eq("id",b.dataset.c));});
  document.querySelectorAll("[data-cs]").forEach(b=>b.onclick=()=>{const id=b.dataset.cs,q=a=>document.querySelector(`[data-${a}="${id}"]`).value;act(sb.from("clubs").update({color1:q("k1"),color2:q("k2")}).eq("id",id));});
  $("#lo").onclick=async()=>{await sb.auth.signOut();ADM=false;render();};
  $("#f").onchange=importFollowers;
  const addManual=async(raw)=>{const r=$("#mr"),ok=u=>/^[a-z0-9._]{1,30}$/.test(u),set=new Set(),bad=[];
    String(raw).split(/[\s,;]+/).filter(Boolean).forEach(x=>{const u=user(x);if(ok(u))set.add(u);else bad.push(x);});
    if(!set.size){r.className="err";r.textContent=bad.length?"Username tidak valid: "+bad.slice(0,5).join(", "):"Isi username dulu.";return;}
    r.className="mut";r.textContent="Menyimpan…";
    const {error}=await sb.from("allowed").upsert([...set].map(username=>({username})),{onConflict:"username",ignoreDuplicates:true});
    if(error){r.className="err";r.textContent="Gagal: "+error.message;return;}
    r.className="ok";r.textContent=set.size+" username ditambahkan"+(bad.length?" · "+bad.length+" dilewati karena tidak valid ("+bad.slice(0,3).join(", ")+")":"")+".";
    $("#mu").value="";$("#mx").value="";};
  $("#mb").onclick=()=>addManual($("#mu").value);
  $("#mu").onkeydown=e=>{if(e.key==="Enter")addManual($("#mu").value);};
  $("#mxb").onclick=()=>addManual($("#mx").value);
  $("#sm2").onclick=async()=>{
    const mm=$("#mm"),rows=[];mm.textContent="";
    for(const l of $("#mt").value.split("\n").map(x=>x.trim()).filter(Boolean)){
      const m=l.match(/^(.+?)\s+(\d{1,2})\s*[-–:]\s*(\d{1,2})\s+(.+)$/),f=n=>DATA.clubs.find(c=>nm(c.name)===nm(n));
      const h=m&&f(m[1]),a=m&&f(m[4]);
      if(!m||!h||!a||h===a){mm.textContent="Baris tidak valid atau klub tidak dikenal: "+l;return;}
      rows.push({home:h.id,away:a.id,hg:+m[2],ag:+m[3]});
    }
    const d=await sb.from("matches").delete().gte("id",0);if(d.error){mm.textContent=d.error.message;return;}
    if(rows.length){const i=await sb.from("matches").insert(rows);if(i.error){mm.textContent=i.error.message;return;}}
    await loadAll();render();
  };
  const draw=()=>{const q=user($("#ps").value),ls=DATA.players.filter(p=>!q||p.u.includes(q)).slice(0,40);
    $("#pl").innerHTML=ls.map(p=>`<div class="row"><span><span class="no">${p.n}</span>@${esc(p.u)} <span class="mut">${esc(p.pos)} · ${esc(p.club)}</span></span><button class="sm" data-x="${esc(p.u)}">Hapus</button></div>`).join("")||'<p class="mut">Tidak ada.</p>';
    document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{if(confirm("Hapus @"+b.dataset.x+"? Dia bisa mendaftar ulang."))act(sb.from("players").delete().eq("username",b.dataset.x));});};
  $("#ps").oninput=draw;draw();
}
async function importFollowers(e){
  const im=$("#im"),f=e.target.files[0];if(!f)return;
  im.className="mut";im.textContent="Membaca file…";
  const txt=await f.text(),set=new Set(),ok=u=>/^[a-z0-9._]{1,30}$/.test(u);
  try{
    const j=JSON.parse(txt),arr=Array.isArray(j)?j:(j.relationships_followers||[]);
    arr.forEach(o=>(o.string_list_data||[]).forEach(s=>{const u=user(s.value);if(ok(u))set.add(u);}));
  }catch(_){txt.split(/[\s,]+/).forEach(x=>{const u=user(x);if(ok(u))set.add(u);});}
  const list=[...set].map(username=>({username}));
  if(!list.length){im.className="err";im.textContent="Tidak ada username yang terbaca.";return;}
  for(let i=0;i<list.length;i+=500){
    const {error}=await sb.from("allowed").upsert(list.slice(i,i+500),{onConflict:"username",ignoreDuplicates:true});
    if(error){im.className="err";im.textContent="Gagal: "+error.message;return;}
    im.textContent="Mengimpor "+Math.min(i+500,list.length)+" dari "+list.length+"…";
  }
  im.className="ok";im.textContent=list.length+" follower berhasil diimpor.";
}
(function(){
  const tf=new Intl.DateTimeFormat("id-ID",{timeZone:"Asia/Jakarta",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}),
        df=new Intl.DateTimeFormat("id-ID",{timeZone:"Asia/Jakarta",weekday:"short",day:"numeric",month:"short",year:"numeric"});
  const t=document.getElementById("ck-t"),d=document.getElementById("ck-d");
  const tick=()=>{const n=new Date();t.textContent=tf.format(n).replace(/\./g,":")+" WIB";d.textContent=df.format(n);t.dateTime=n.toISOString();};
  tick();setInterval(tick,1000);
})();
boot();
</script>
